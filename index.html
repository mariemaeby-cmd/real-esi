<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ES-pital | Spatial Healthcare Directory</title>
    <link rel="stylesheet" href="https://unpkg.com" crossorigin="" />
    <style>
        :root {
            --bg-offwhite: #fcfbfa;
            --txt-charcoal: #2c2c2c;
            --txt-muted: #595959;
            --jewel-teal: #006666;
            --jewel-teal-hover: #004d4d;
            --border-light: #e6e4e0;
            --card-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
        }
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-offwhite); color: var(--txt-charcoal); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background-color: #ffffff; border-bottom: 1px solid var(--border-light); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 1000; }
        .brand { font-size: 20px; font-weight: 700; color: var(--jewel-teal); letter-spacing: -0.5px; }
        .brand span { color: var(--txt-charcoal); }
        .tagline { font-size: 13px; color: var(--txt-muted); }
        .workspace { flex: 1; display: flex; position: relative; height: calc(100vh - 54px); }
        .search-console { position: absolute; top: 20px; left: 20px; width: 380px; max-height: calc(100% - 40px); background: rgba(252, 251, 250, 0.96); backdrop-filter: blur(8px); border: 1px solid var(--border-light); border-radius: 12px; box-shadow: var(--card-shadow); z-index: 1000; display: flex; flex-direction: column; overflow: hidden; }
        .search-wrapper { padding: 16px; background: #ffffff; border-bottom: 1px solid var(--border-light); }
        .search-box { width: 100%; padding: 14px 16px; font-size: 15px; color: var(--txt-charcoal); background-color: var(--bg-offwhite); border: 1px solid var(--border-light); border-radius: 8px; box-sizing: border-box; outline: none; }
        .results-container { flex: 1; overflow-y: auto; padding: 8px 0; }
        .location-card { padding: 16px 20px; border-bottom: 1px solid var(--border-light); cursor: pointer; position: relative; display: flex; flex-direction: column; }
        .location-card:hover { background-color: rgba(0, 102, 102, 0.03); }
        .location-card.active { background-color: rgba(0, 102, 102, 0.06); border-left: 4px solid var(--jewel-teal); padding-left: 16px; }
        .facility-name { font-size: 15px; font-weight: 600; margin: 0 0 4px 0; }
        .facility-meta { font-size: 13px; color: var(--txt-muted); margin: 2px 0; }
        .gmaps-link { position: absolute; right: 20px; top: 20px; width: 32px; height: 32px; border-radius: 50%; background-color: #ffffff; border: 1px solid var(--border-light); display: flex; align-items: center; justify-content: center; color: var(--jewel-teal); text-decoration: none; font-weight: bold; }
        .gmaps-link:hover { background-color: var(--jewel-teal); color: #ffffff; }
        #map-view { width: 100%; height: 100%; z-index: 1; }
        .status-counter { font-size: 12px; color: var(--txt-muted); margin-top: 8px; }
        @media (max-width: 600px) {
            .workspace { flex-direction: column-reverse; }
            .search-console { position: relative; top: 0; left: 0; width: 100%; max-height: 50%; }
            #map-view { height: 50%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">🏥 ES-pital <span>Directory</span></div>
        <div class="tagline">Live OpenStreetMap ESI Hospital Navigation</div>
    </header>

    <div class="workspace">
        <div class="search-console">
            <div class="search-wrapper">
                <input type="text" id="mapSearchInput" class="search-box" placeholder="Search all locations, states, cities..." onkeyup="processConsoleQuery()">
                <div class="status-counter" id="recordCounter">Querying global maps live...</div>
            </div>
            <div class="results-container" id="resultsViewStack"></div>
        </div>
        <div id="map-view"></div>
    </div>

    <script src="https://unpkg.com" crossorigin=""></script>
    <script>
        let mapInstance = null;
        let markersGroupArray = [];
        let locationRecordsDatabase = [];

        function initializeSpatialMap() {
            mapInstance = L.map('map-view', { zoomControl: false }).setView([22.9734, 78.6568], 5);
            L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(mapInstance);
            L.control.zoom({ position: 'topright' }).addTo(mapInstance);

            fetchLiveMapDataDirectly();
        }

        // Bypasses all GitHub Actions completely by fetching map nodes straight to user browsers
        function fetchLiveMapDataDirectly() {
            const query = '[out:json][timeout:60];area["ISO3166-1"="IN"]->.a;(node["amenity"="hospital"]["name"~"ESI",i](area.a);node["amenity"="clinic"]["name"~"ESI",i](area.a););out tags center;';
            
            fetch('https://overpass-api.de', {
                method: 'POST',
                body: 'data=' + encodeURIComponent(query)
            })
            .then(res => res.json())
            .then(data => {
                const elements = data.elements || [];
                locationRecordsDatabase = elements.map(item => {
                    const tags = item.get ? item.get('tags') : (item.tags || {});
                    const lat = item.lat || (item.center ? item.center.lat : 20);
                    const lon = item.lon || (item.center ? item.center.lon : 78);
                    return {
                        state: tags['addr:state'] || 'India Region',
                        location: tags.name || 'ESI Facility',
                        city: tags['addr:city'] || tags['addr:district'] || 'Local Zone',
                        type: (tags.amenity || 'Hospital').toUpperCase(),
                        contact: tags.phone || tags['contact:phone'] || 'Verify via Portal',
                        lat: lat,
                        lon: lon
                    };
                });
                renderDirectoryInterface(locationRecordsDatabase);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('recordCounter').innerText = "Connection alert. Using local fallback view.";
                renderDirectoryInterface([
                    { state: "Karnataka", location: "ESIC Model Hospital Rajajinagar", city: "Bengaluru", type: "HOSPITAL", contact: "080-23129009", lat: 12.9892, lon: 77.5534 }
                ]);
            });
        }

        function renderDirectoryInterface(records) {
            const viewStack = document.getElementById('resultsViewStack');
            viewStack.innerHTML = '';
            markersGroupArray.forEach(m => mapInstance.removeLayer(m));
            markersGroupArray = [];

            document.getElementById('recordCounter').innerText = `Showing ${records.length} active ESI facilities mapped`;

            records.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'location-card';
                card.id = `card-node-${index}`;
                card.onclick = () => focusSpecificCoordinateNode(item.lat, item.lon, index);

                card.innerHTML = `
                    <h3 class="facility-name">${item.location}</h3>
                    <div class="facility-meta">📍 ${item.city}, ${item.state}</div>
                    <div class="facility-meta">📞 Contact: ${item.contact}</div>
                    <a href="https://google.com{encodeURIComponent(item.location)}" target="_blank" class="gmaps-link" onclick="event.stopPropagation();">➔</a>
                `;
                viewStack.appendChild(card);

                const markerPin = L.marker([item.lat, item.lon]).addTo(mapInstance);
                markerPin.bindPopup(`<b>${item.location}</b><br>${item.city}<br>Ph: ${item.contact}`);
                markerPin.on('click', () => focusSpecificCoordinateNode(item.lat, item.lon, index, false));
                markersGroupArray.push(markerPin);
            });
        }

        function focusSpecificCoordinateNode(lat, lon, idx, moveMap = true) {
            document.querySelectorAll('.location-card').forEach(c => c.classList.remove('active'));
            const c = document.getElementById(`card-node-${idx}`);
            if(c) { c.classList.add('active'); c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
            if(moveMap) mapInstance.setView([lat, lon], 14, { animate: true });
            markersGroupArray[idx].openPopup();
        }

        function processConsoleQuery() {
            const q = document.getElementById('mapSearchInput').value.toLowerCase();
            const f = locationRecordsDatabase.filter(i => i.state.toLowerCase().includes(q) || i.location.toLowerCase().includes(q) || i.city.toLowerCase().includes(q));
            renderDirectoryInterface(f);
        }

        window.onload = initializeSpatialMap;
    </script>
</body>
</html>
