name: Run ES-pital Data Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Access Repository Files
      uses: actions/checkout@v4

    - name: Load Python Operations Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Execute Map Scraper Engine
      run: python scraper.py

    - name: Automatically Save and Push Fresh Data Live
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-sync live verified geospatial map records"
        file_pattern: "esi_live_data.json
