name: Run ES-pital Data Pipeline

on:
  workflow_dispatch: # Keeps your manual click button active
  schedule:
    - cron: '0 5 * * 1' # Automatically runs every Monday morning on its own

permissions:
  contents: write # Crucial: Explicitly unlocks folder write access to bypass exit code 128

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Access Repository Files
      uses: actions/checkout@v4

    - name: Load Python Operations Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Execute Map Scraper Engine
      run: python scraper.py

    # SECURE PLUGIN FIX: Replaces manual terminal git commands entirely
    - name: Automatically Save and Push Fresh Data Live
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-sync live verified geospatial map records"
        file_pattern: "esi_live_data.json"
        
