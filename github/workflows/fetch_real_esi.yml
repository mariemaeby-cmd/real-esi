name: Run ES-pital Data Pipeline

on:
  workflow_dispatch: # Gives you a manual clickable button to run it instantly
  schedule:
    - cron: '0 5 * * 1' # Automatically updates your public website every Monday morning

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Access Repository Files
      uses: actions/checkout@v3

    - name: Load Python Operations Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Data Dependencies
      run: pip install requests pandas

    - name: Execute Map Scraper Engine
      run: python scraper.py

    - name: Save Fresh Data and Push Live to Website
      run: |
        git config --global user.name 'ES-pital Data Core'
        git config --global user.email 'data-core@es-pital.internal'
        git add esi_live_data.json
        git commit -m "Auto-sync live verified geospatial map records" || exit 0
        git push
        
